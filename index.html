<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>QuizBee</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>


<body>

<div id="app">

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <header class="top-header">

        <div class="brand">
            🐝 <span>QuizBee</span>
        </div>

        <div class="points-display">
            <span>🐝</span>
            <span id="points">240</span>
        </div>

    </header>


    <!-- ========================================= -->
    <!-- HOME -->
    <!-- ========================================= -->

    <section id="home" class="screen active">

        <div class="hero">

            <h1>Think Fast. Win Big. 🐝</h1>

            <p>
                Challenge your brain and compete with players around the world.
            </p>

        </div>


        <div class="section-heading">

            <h2>🔥 Games</h2>

            <p>Choose your challenge</p>

        </div>


        <div id="game-list"></div>


        <!-- SUNDAY FINAL -->

        <div class="final-card">

            <div>

                <span class="final-label">
                    💀 SUNDAY FINAL
                </span>

                <h2>Impossible Question</h2>

                <p>
                    The hardest challenge of the week.
                </p>

            </div>

            <div class="countdown">

                <strong>COMING SOON</strong>

            </div>

        </div>


        <!-- QUICK STATS -->

        <div class="quick-stats">

            <div>
                <strong id="score">0</strong>
                <span>Score</span>
            </div>

            <div>
                <strong id="streak">4</strong>
                <span>🔥 Streak</span>
            </div>

            <div>
                <strong id="referrals">7</strong>
                <span>Referrals</span>
            </div>

        </div>

    </section>


    <!-- ========================================= -->
    <!-- GAME -->
    <!-- ========================================= -->

    <section id="game" class="screen">

        <div class="game-header">

            <button onclick="goHome()" class="back-btn">
                ←
            </button>

            <h2 id="game-title">
                Game
            </h2>

        </div>

        <div id="game-content"></div>

    </section>


    <!-- ========================================= -->
    <!-- WALLET -->
    <!-- ========================================= -->

    <section id="wallet" class="screen">

        <div class="page-header">

            <button onclick="goHome()" class="back-btn">
                ←
            </button>

            <h2>💰 Wallet</h2>

        </div>

        <div id="wallet-content"></div>

    </section>


    <!-- ========================================= -->
    <!-- LEADERBOARD -->
    <!-- ========================================= -->

    <section id="leaderboard" class="screen">

        <div class="page-header">

            <button onclick="goHome()" class="back-btn">
                ←
            </button>

            <h2>🏆 Leaderboard</h2>

        </div>

        <div id="leaderboard-content"></div>

    </section>


    <!-- ========================================= -->
    <!-- PROFILE -->
    <!-- ========================================= -->

    <section id="profile" class="screen">

        <div class="page-header">

            <button onclick="goHome()" class="back-btn">
                ←
            </button>

            <h2>👤 Profile</h2>

        </div>

        <div id="profile-content"></div>

    </section>


    <!-- ========================================= -->
    <!-- BOTTOM NAV -->
    <!-- ========================================= -->

    <nav class="bottom-nav">

        <button onclick="navigate('home')">
            🏠
            <span>Home</span>
        </button>

        <button onclick="navigate('leaderboard')">
            🏆
            <span>Leaderboard</span>
        </button>

        <button onclick="navigate('wallet')">
            💰
            <span>Wallet</span>
        </button>

        <button onclick="navigate('profile')">
            👤
            <span>Profile</span>
        </button>

    </nav>

</div>


<script src="app.js"></script>

</body>

    </html>
